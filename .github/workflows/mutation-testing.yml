name: Mutation Testing

on:
  pull_request:
    paths:
      - 'src/**.php'
      - 'tests/**.php'
      - 'infection.json5'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  infection:
    name: infection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Infection reports only on mutants in the diff, which needs history.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run Infection
        run: |
          vendor/bin/infection \
            --threads=max \
            --git-diff-lines \
            --git-diff-base=origin/${{ github.base_ref }} \
            --logger-github \
            --no-progress \
            --ignore-msi-with-no-mutations
        env:
          INFECTION_BADGE_API_KEY: ""
