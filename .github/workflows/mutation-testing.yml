name: Mutation Testing

on:
  pull_request:
    paths:
      - 'src/**.php'
      - 'tests/**.php'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      # Coverage says a line ran. Mutation testing says an assertion would
      # have noticed if it were wrong, which is the question that matters
      # for a redactor.
      - name: Run mutation testing
        run: vendor/bin/pest --mutate --parallel --everything --covered-only --min=75 --ignore-min-score-on-zero-mutations
