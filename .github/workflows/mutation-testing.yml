name: Mutation Testing

on:
  pull_request:
    paths:
      - 'src/**.php'
      - 'tests/**.php'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      # Coverage says a line ran. Mutation testing says an assertion would
      # have noticed if it were wrong, which is the question that matters
      # for a redactor.
      #
      # Reported, not gated - deliberately, for now. Two consecutive runs
      # scored 70.6% and 66.7% over an identical set of 1,557 mutants, with
      # 60 reclassified from killed to survived. The only change between
      # them was 21 added tests, all passing, which cannot resurrect a
      # killed mutant. So the variance is in the runner, not the suite -
      # most likely the interaction of --parallel with the per-mutant
      # timeout, since the timeout count moved too (36 -> 21).
      #
      # Gating on a number that swings four points on its own would produce
      # red builds unrelated to code quality, and a check that cries wolf
      # gets ignored and then deleted. --parallel is dropped here as the
      # likeliest source; once several runs agree to within a point, put
      # --min back at the observed floor and remove continue-on-error.
      - name: Run mutation testing
        continue-on-error: true
        run: vendor/bin/pest --mutate --everything --covered-only --ignore-min-score-on-zero-mutations
