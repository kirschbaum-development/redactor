name: PHP Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One unusable matrix leg should not cancel the other nine.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.3', '8.4', '8.5']
        laravel: [11.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 11.*
            testbench: ^9.9
            carbon: ^2.63
          - laravel: 12.*
            testbench: 10.*
            carbon: ^2.63|^3.0
        exclude:
          # Laravel 11 does not support PHP 8.5.
          - php: '8.5'
            laravel: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, swoole, openssl
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # Every Laravel 11.x release is now flagged by a Packagist security
      # advisory, so Composer's default policy refuses to install any of
      # them. The advisory blocking is disabled for that leg only, so the
      # package's declared Laravel 11 support stays under test. Nothing
      # vulnerable is shipped - this is a CI install of a framework the
      # library only ever runs against here.
      #
      # The real decision this defers is whether to keep supporting
      # Laravel 11 at all, which is a release call rather than a CI one.
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction ${{ startsWith(matrix.laravel, '11') && '--no-security-blocking' || '' }}

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci --compact --memory --coverage --min=80

  performance:
    name: performance guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          # Explicitly no coverage: instrumentation dominates the clock and
          # flattens the difference between a fast and a slow implementation,
          # so these assertions skip themselves when a driver is active.
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run performance guards
        run: vendor/bin/pest --testsuite=Performance --ci
