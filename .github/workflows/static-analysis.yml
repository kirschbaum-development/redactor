name: Static Analysis

on:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - '.github/workflows/static-analysis.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - '.github/workflows/static-analysis.yml'

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, swoole, openssl
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github --no-progress --memory-limit=1G